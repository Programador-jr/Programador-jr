name: Grow Git Bonsai

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Grow bonsai from GitHub history
        uses: egorthinks/git-bonsai@v1
        with:
          user: Programador-jr
          output-dir: output
          season: auto
          github-token: ${{ secrets.GITHUB_TOKEN }}
